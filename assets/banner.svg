<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Louisss — Backend and AI Agent Engineer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0B10"/>
      <stop offset="100%" stop-color="#0A0B10" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" fill="#0A0B10"/>

  <!-- faint vertical rule grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/>
    <line x1="0" y1="150" x2="900" y2="150" stroke-opacity="0.03"/>
  </g>

  <!-- agent network: nodes + flowing edges -->
  <g fill="none" stroke="#6366F1" stroke-opacity="0.42" stroke-width="1">
    <path d="M648,86 L772,132" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M772,132 L706,196" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M648,86 L628,164" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="3.1s" repeatCount="indefinite"/>
    </path>
    <path d="M628,164 L706,196" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M772,132 L842,92" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="3.7s" repeatCount="indefinite"/>
    </path>
    <path d="M842,92 L862,168" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="3.0s" repeatCount="indefinite"/>
    </path>
    <path d="M862,168 L706,196" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="3.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#22D3EE">
    <circle cx="648" cy="86" r="3.4" filter="url(#soft)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="772" cy="132" r="4.2" filter="url(#soft)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="706" cy="196" r="3.4" filter="url(#soft)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="628" cy="164" r="2.8" filter="url(#soft)">
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="842" cy="92" r="2.8" filter="url(#soft)">
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="3.8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="862" cy="168" r="3.4" filter="url(#soft)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1">
    <circle cx="772" cy="132" r="13"/>
    <circle cx="648" cy="86" r="10"/>
    <circle cx="706" cy="196" r="10"/>
  </g>

  <!-- identity block -->
  <text x="56" y="94" font-family="Consolas, Monaco, monospace" font-size="12" fill="#818CF8" letter-spacing="4.5">BACKEND · AI AGENT ENGINEER</text>

  <text x="56" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#F8FAFC" letter-spacing="1">Louisss</text>

  <text x="58" y="192" font-family="PingFang SC, Microsoft YaHei, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#94A3B8">Java / Python 双栈后端 · AI Agent 工程化</text>

  <text x="58" y="220" font-family="PingFang SC, Microsoft YaHei, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#64748B">把 Agent 做成能上线的系统，而不是能跑的 demo</text>

  <text x="58" y="246" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#475569" letter-spacing="1.5">XIAMEN, CN · OPEN TO WORK</text>

  <!-- accent rule -->
  <rect x="56" y="272" width="0" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="0;788" dur="1.8s" fill="freeze"/>
  </rect>
</svg>
