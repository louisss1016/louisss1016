<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-label="footer">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="900" height="72" fill="#0A0B10"/>

  <rect x="0" y="0" width="900" height="1.5" fill="url(#rule)" opacity="0.75">
    <animate attributeName="opacity" values="0.25;0.85;0.25" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="0" y="42" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#475569" letter-spacing="2.6">DESIGNED &amp; BUILT BY LOUISSS</text>

  <text x="900" y="42" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#475569" letter-spacing="2.6">XIAMEN · CN</text>
</svg>
