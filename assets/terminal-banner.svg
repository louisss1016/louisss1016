  <circle cx="30" cy="27" r="5" fill="#3d434b"/>
  <circle cx="48" cy="27" r="5" fill="#3d434b"/>
  <circle cx="66" cy="27" r="5" fill="#3d434b"/>
  <text x="450" y="32" text-anchor="middle" fill="#6e7681" font-size="12">louisss@dev: ~</text>

  <!-- body, loose line-height -->
