<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="884" height="264" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M8 20 a12 12 0 0 1 12 -12 h860 a12 12 0 0 1 12 12 v26 h-884 z" fill="#161b22"/>
  <circle cx="34" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="21" r="6" fill="#febc2e"/>
  <circle cx="74" cy="21" r="6" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" fill="#8b949e" font-size="13">louisss@github: ~/profile — bash</text>

  <!-- body -->
  <text x="30" y="78" fill="#00ff41" font-size="15" filter="url(#glow)">&gt; _ whoami</text>
  <text x="30" y="103" fill="#c9d1d9" font-size="14">Louisss — developer, Xiamen. Shipping code, drinking coffee.</text>

  <text x="30" y="135" fill="#00ff41" font-size="15" filter="url(#glow)">&gt; _ ls ~/projects</text>
  <text x="30" y="158" fill="#c9d1d9" font-size="14">15 public repos · 2 private · commits since 2025</text>

  <text x="30" y="190" fill="#00ff41" font-size="15" filter="url(#glow)">&gt; _ ./deploy --prod</text>
  <text x="30" y="213" fill="#8b949e" font-size="14">→ building... pushing... <tspan fill="#00ff41">done. 200 OK in 1.2s</tspan></text>

  <!-- blinking cursor -->
  <rect x="30" y="228" width="11" height="17" fill="#00ff41" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
